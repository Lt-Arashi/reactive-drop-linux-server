services:
  swarm:
    image: mithrand0/reactive-drop-linux-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # startup variables
      - "port=27050"
      - "maxplayers=16"
      - "wine_fastsync=1" # enable this if you have a winesync enabled kernel, ie xanmod

      # 这里可以写服务器控制台变量
      # 比如, rd_rcon_password 就是 rcon_password
      #- "rd_hostname=[CN猫猫大豪斯] HspAF 测试 Linux Server"
      - "rd_rcon_password=HspAFrd1"

      # 创意工坊可以写在这里,自己写workshop貌似会出问题,如果你新加了项目,你需要关闭docker重新加载该文件来应用

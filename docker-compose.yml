services:
  swarm:
    image: mithrand0/reactive-drop-linux-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # CPU 限制: 把本服务器固定到指定核心(多实例时给每个实例设不同的 CPUSET)。
    # 留空 = 不限制。示例: "0" 单核、"0-3" 0~3 号核心、"0,2" 0 和 2 号核心。
    cpuset: "${CPUSET:-}"
    environment:
      # 启动项(在 .env 中修改)
      - "PORT=${PORT:-27050}"
      - "MAXPLAYERS=${MAXPLAYERS:-16}"
      - "TICKRATE=${TICKRATE:-100}"

      # 其余游戏配置(hostname、rcon、rd_* 等)请上传你自己的 cfg 到
      #   reactivedrop/reactivedrop/cfg/ (如 server.cfg / autoexec.cfg)
      # 创意工坊请在 reactivedrop/reactivedrop/cfg/workshop.cfg 中按行写:
      #   rd_enable_workshop_item <id>

    networks:
      - network
    ports:
      # 启动端口,请与 .env 中的 PORT 一致
      - "${PORT:-27050}:${PORT:-27050}/tcp"
      - "${PORT:-27050}:${PORT:-27050}/udp"
    volumes:
      # 游戏目录(含你的 cfg / workshop / 地图缓存)挂到宿主机 ./reactivedrop
      - "./reactivedrop:/usr/lib/games/reactivedrop"

      # 挂载 entrypoint.sh 方便修改启动项(改完 ./setup.sh rebuild)
      - "./entrypoint.sh:/entrypoint.sh"

      # 时区: 继承宿主机时区, 让容器内日志时间与宿主机一致(无需重建镜像)
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      # 可选: winesync 加速(仅当内核支持且存在 /dev/winesync 时取消注释)
      # - "/dev/winesync:/dev/winesync"

networks:
  network:

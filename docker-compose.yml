    networks:
      - network
    ports:
      # 启动端口,请于上方的port一致
      - "27050:27050/tcp"
      - "27050:27050/udp"
    volumes:
      # enable fast winesync (if available in kernel)
      - "/dev/winesync:/dev/winesync"

      # volumes功能为挂载,也就是说从从容器中映射出某个部分到宿主机，在宿主机内修改后会自动同步到容器内
      # 如果游戏更新，可能做出的修改会被覆盖,注意备份
      - "./reactivedrop:/usr/lib/games/reactivedrop"

      # 因为我的强迫症无法容忍崩溃的mdmp文件越攒越多,所以放弃了单独挂几个文件夹的想法
      # - ./reactivedrop/cfg:/usr/lib/games/reactivedrop/reactivedrop/cfg"
      # - ./reactivedrop/addons:/usr/lib/games/reactivedrop/reactivedrop/addons"
      # - ./reactivedrop/scripts:/usr/lib/games/reactivedrop/reactivedrop/scripts"
      # - ./reactivedrop/workshop:/usr/lib/games/reactivedrop/reactivedrop/workshop"
      
      # 挂entrypoint.sh方便日后修改启动项,以及注释检查服务端更新,加快重启
      - ./entrypoint.sh:/entrypoint.sh

networks:
  network:

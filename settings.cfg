// -----------------------------------------------------------------------------------------------------------------------------------
sv_region 255
sv_lan 0
// -----------------------------------------------------------------------------------------------------------------------------------
// [resources]
rd_override_fps_max 0		//服务端最大fps限制
//sv_memlimit 900			//限制使用内存
// -----------------------------------------------------------------------------------------------------------------------------------
// [网络相关]
sv_minrate 20000
sv_maxrate 120000
sv_minupdaterate 20
sv_maxupdaterate 24
sv_mincmdrate 60
sv_maxcmdrate 60
net_splitrate 2
net_splitpacket_maxrate 120000
net_maxcleartime 0.001
rd_adjust_sv_maxrate 0
// -----------------------------------------------------------------------------------------------------------------------------------
// [lerp]
sv_client_max_interp_ratio 2
sv_client_min_interp_ratio 0
sv_client_predict 1
sv_client_cmdrate_difference 0
// -----------------------------------------------------------------------------------------------------------------------------------
// [tweaks]
mod_dont_load_vertices 1        // For the dedicated server, supress loading model vertex data
//sv_mapspawn_nut_exec 1          // If set to 1, server will execute scripts/vscripts/mapspawn.nut file
// -----------------------------------------------------------------------------------------------------------------------------------
// [workshop fixes]
rd_workshop_update_every_round 0	// 每局检查workshop更新
// -----------------------------------------------------------------------------------------------------------------------------------
// [rd specific]
asw_marine_death_cam_slowdown 0     // 士兵阵亡慢放
rd_override_allow_rotate_camera 1   // 是否允许旋转视角
rd_ready_mark_override 1            // 自动准备
rd_server_shutdown_when_empty 1	    // 服务器在最后一名玩家离开后炸服
// -----------------------------------------------------------------------------------------------------------------------------------
// [server engine settings]
asw_max_saves 5
sv_stats 0
sv_allow_wait_command 0             // 是否禁Wait
//sv_allow_lobby_connect_only 1       // If set, players may only join this server from matchmaking lobby, may not connect directly.
sv_forcepreload 1
// -----------------------------------------------------------------------------------------------------------------------------------
// [server log settings]
log off
con_timestamp 1
sv_logbans 1
sv_logblocks 0
sv_logecho 0
sv_logfile 0
sv_logflush 0
// -----------------------------------------------------------------------------------------------------------------------------------
// [disable uploads/downloads]
sv_allowdownload 0
sv_allowupload 0
// -----------------------------------------------------------------------------------------------------------------------------------
// [Rcon]
sv_rcon_banpenalty 86400
sv_rcon_log 1
sv_rcon_maxfailures 2
sv_rcon_minfailures 1
sv_rcon_minfailuretime 3600
// -----------------------------------------------------------------------------------------------------------------------------------
// [自定义Cvar]
rd_server_marine_backpacks 1	// 仅服务端cvar显示背部武器
rd_auto_fast_restart 1 		    // 快速重启
//rd_server_shutdown_after_num_secs 10 	// 每3600秒炸服重启一次避免maxrate出现问题
rd_alien_instagib 1
rd_slowmo 0                     // 移除env_slomo实体,不影响肾上腺素
//asw_instant_restart 0           // 是否即时重启

//Ranked
//rd_server_api_key 

exec user